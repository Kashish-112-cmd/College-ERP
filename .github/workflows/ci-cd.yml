name: College ERP CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Application
        run: |
          echo "Building College ERP application..."
          test -f index.html
          echo "Build successful"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Run Tests
        run: |
          echo "Running tests..."
          grep -q "College ERP System" index.html
          grep -q "View Attendance" index.html
          grep -q "View Student Profile" index.html
          echo "All tests passed"

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Create Package
        run: |
          mkdir package
          cp index.html package/
          cp README.md package/
          tar -czf college-erp.tar.gz package

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: college-erp-package
          path: college-erp.tar.gz

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: package

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
